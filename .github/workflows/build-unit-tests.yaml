      run: ./run_with_valgrind.sh
    - name: Verify test sets and changed binary
      run: "python3 - <<'PY'\nimport os, pathlib, xml.etree.ElementTree as ET\ntmp=pathlib.Path(os.environ['RUNNER_TEMP'])\ndef passed(p):\n    root=ET.parse(p).getroot()\n    return {(c.get('classname'),c.get('name'))\
        \ for c in root.iter('testcase') if c.get('result')=='completed' and c.find('failure') is None}\na,b=passed(tmp/'asan.xml'),passed(tmp/'memcheck.xml')\nassert a==b and len(a)==1931, (len(a),len(b))\n\
        assert (('CompilerCacheProbe','ChangedTranslationUnit') in a)==True\nprint('Verified',len(a),'identical passing tests in both binaries.')\nPY"
