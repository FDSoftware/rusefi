name: Kawasaki replay Memcheck A/B
on: workflow_dispatch
permissions:
  contents: read

jobs:
  benchmark:
    if: github.repository == 'FDSoftware/rusefi' || github.repository == 'CarpinchoEngineer/rusefi'
    runs-on: ${{ github.repository == 'CarpinchoEngineer/rusefi' && 'blacksmith-4vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rusefi/rusefi
          ref: b48ba88c805e85380ad833b35da9875fe59c1c9c
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/submodule-init
        with:
          chibios: 'false'
      - name: Install Linux unit-test dependencies
        run: |
          sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh
          sudo bash misc/actions/ubuntu-install-tools.sh
          bash misc/actions/install-valgrind.sh
      - name: Build one Memcheck binary for both arms
        working-directory: unit_tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/trigger/test_real_kawasaki_8_minus_1.cpp")
          s = p.read_text()
          anchor = "\tCsvReader reader(1, /* vvtCount */ 0);"
          assert s.count(anchor) == 1
          p.write_text(s.replace('#include "logicdata_csv_reader.h"', '#include "logicdata_csv_reader.h"\n#include <cstdlib>')
                        .replace(anchor, '\tScopedUnitTestCreateLogs logs(std::getenv("KAWASAKI_NO_LOGS") == nullptr);\n' + anchor))
          PY
          make -j4 docs-enums
          make -j4 config
          ./make_for_valgrind.sh
          sha256sum build/rusefi_test
          valgrind --version
      - name: Measure logging on / off / off / on
        working-directory: unit_tests
        env:
          GTEST_FILTER: realKawasaki8minus1.*
        run: |
          python3 - <<'PY'
          import os, re, statistics, subprocess, time
          from pathlib import Path
          from xml.etree import ElementTree as ET

          out = Path(os.environ["RUNNER_TEMP"])
          results = Path("test_results")
          seen = None
          timings = {"on": [], "off": []}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("| Pass | Logging | Suite (s) | Memcheck wall (s) | Cases |", "|---:|---|---:|---:|---:|", sep="\n", file=summary)
              for i, mode in enumerate(("on", "off", "off", "on"), 1):
                  xml = out / f"kawasaki-{i}.xml"
                  env = dict(os.environ, GTEST_OUTPUT=f"xml:{xml}")
                  env.pop("KAWASAKI_NO_LOGS", None)
                  if mode == "off":
                      env["KAWASAKI_NO_LOGS"] = "1"
                  def files(ext):
                      return set(results.glob(f"unittest_realKawasaki8minus1_*.{ext}"))
                  for path in files("msl") | files("csv"):
                      path.unlink()
                  start = time.monotonic()
                  proc = subprocess.run(["./run_with_valgrind.sh"], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  elapsed = time.monotonic() - start
                  text = proc.stdout.decode(errors="replace")
                  print(text, flush=True)
                  proc.check_returncode()
                  assert re.search(r"ERROR SUMMARY: 0 errors from 0 contexts", text)
                  suite = ET.parse(xml).getroot()
                  cases = suite.findall(".//testcase")
                  names = {c.attrib["name"] for c in cases}
                  assert len(cases) == len(names) == 12 and all(c.get("classname") == "realKawasaki8minus1" and c.get("result") == "completed" for c in cases)
                  assert seen is None or seen == names
                  seen = names
                  for ext in ("msl", "csv"):
                      expected = {results / f"unittest_realKawasaki8minus1_{n}.{ext}" for n in names} if mode == "on" else set()
                      assert files(ext) == expected and all(p.stat().st_size > 0 for p in expected), (mode, ext)
                  wall = float(suite.attrib["time"])
                  timings[mode].append(wall)
                  print(f"| {i} | {mode} | {wall:.3f} | {elapsed:.3f} | 12 |", file=summary, flush=True)
              a, b = (statistics.mean(timings[m]) for m in ("on", "off"))
              print(f"\nMean suite time: {a:.3f}s on, {b:.3f}s off; savings {a-b:.3f}s ({1-b/a:.1%}).", file=summary)
          PY
